[package]
name = "nautilus-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
anyhow = "1"
libc = "0.2"
blake3 = "1"
nautilus-serialization = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "86e640d623747e5f07b7b7df90e4585193341055", features = ["arrow"] }
arrow = { version = "59.3.2", default-features = false, features = ["ipc"] }
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "86e640d623747e5f07b7b7df90e4585193341055", features = ["live"] }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "86e640d623747e5f07b7b7df90e4585193341055" }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "86e640d623747e5f07b7b7df90e4585193341055" }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "86e640d623747e5f07b7b7df90e4585193341055" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }

[profile.release]
debug = 0
codegen-units = 256
lto = false
