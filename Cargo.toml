[package]
name = "nautilus-polymarket-bootstrap-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
anyhow = "1"
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8705495b380f9b1569cf048d1c0f664707a67a72", features = ["live"] }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8705495b380f9b1569cf048d1c0f664707a67a72" }
nautilus-network = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8705495b380f9b1569cf048d1c0f664707a67a72", default-features = false }
nautilus-polymarket = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8705495b380f9b1569cf048d1c0f664707a67a72" }
serde_json = "1"
tabled = { version = "0.22", default-features = false, features = ["std"] }
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
url = "2"

[lints.rust]
unsafe_code = "forbid"
